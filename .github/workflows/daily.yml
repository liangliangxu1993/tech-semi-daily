name: 科技半导体日报

on:
  # 定时由外部 cron-job.org 每天调用 workflow_dispatch API 触发（比 GitHub 内置 schedule 可靠）。
  # 配置见 DEPLOY.md 第六章。若要回退到 GitHub 内置定时，取消下面注释即可：
  #   schedule:
  #     - cron: "37 0 * * *"   # 00:37 UTC = 北京 08:37
  workflow_dispatch: {}   # 手动触发 + 外部 API（cron-job.org）触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # 允许把每日报告 commit 回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv：比 pip 快 10-100 倍，自带缓存，显著缩短依赖安装时间
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run daily report
        env:
          PUSH_CHANNEL: ${{ vars.PUSH_CHANNEL || 'serverchan' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5' }}
          ENABLE_LLM: ${{ vars.ENABLE_LLM || '1' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.main

      # 即使推送步骤失败也存档（报告在推送前已生成）；GITHUB_TOKEN 的提交不会再触发本工作流，无循环风险
      - name: Archive report to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          git add reports/
          if git diff --cached --quiet; then
            echo "无新增日报，跳过提交"
          else
            git commit -m "chore: 日报存档 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
