name: 科技半导体日报

on:
  schedule:
    # cron 使用 UTC 时间。00:37 UTC = 北京时间 08:37
    # 刻意避开 :00/:30 这些最拥堵的整半点槽位，降低被 GitHub 延迟/丢弃的概率
    # 注意：GitHub Actions 定时任务本身是「尽力而为」，高峰期仍可能延迟 5-15 分钟甚至更久
    - cron: "37 0 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发测试

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # 允许把每日报告 commit 回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv：比 pip 快 10-100 倍，自带缓存，显著缩短依赖安装时间
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run daily report
        env:
          PUSH_CHANNEL: ${{ vars.PUSH_CHANNEL || 'serverchan' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5' }}
          ENABLE_LLM: ${{ vars.ENABLE_LLM || '1' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.main

      # 即使推送步骤失败也存档（报告在推送前已生成）；GITHUB_TOKEN 的提交不会再触发本工作流，无循环风险
      - name: Archive report to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          git add reports/
          if git diff --cached --quiet; then
            echo "无新增日报，跳过提交"
          else
            git commit -m "chore: 日报存档 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
