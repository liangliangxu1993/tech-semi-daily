name: 科技半导体日报

on:
  schedule:
    # cron 使用 UTC 时间。00:30 UTC = 北京时间 08:30
    # 注意：GitHub Actions 定时任务在高峰期可能延迟 5-15 分钟
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发测试

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          PUSH_CHANNEL: ${{ vars.PUSH_CHANNEL || 'serverchan' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5' }}
          ENABLE_LLM: ${{ vars.ENABLE_LLM || '1' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.main
